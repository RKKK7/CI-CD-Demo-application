name: Secrets Demo

on:
  push:
  pull_request:

jobs:
  secrets-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        run: |
          if [ -n "${{ secrets.DEMO_SECRET }}" ]; then
            echo "Secret is available"
          else
            echo "Secret is NOT available"
            exit 1
          fi

      - name: Show secret name
        run: echo "The configured secret is DEMO_SECRET"